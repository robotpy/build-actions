---
name: Package CI

on:
  workflow_call:
    inputs:
      artifactory_repo_type:
        required: true
        type: string
      enable_rtd:
        required: false
        default: true
        type: boolean
      enable_sphinx_check:
        required: false
        default: true
        type: boolean
      enable_raspbian:
        required: false
        default: true
        type: boolean
      enable_roborio:
        required: false
        default: true
        type: boolean
      osx_target:
        required: false
        default: ''
        type: string
      matrix_os:
        required: false
        default: >-
          ["ubuntu-22.04", "macos-13", "macos-14", "windows-2022"]
        type: string
      python_versions:
        required: false
        default: >-
          ["3.9", "3.10", "3.11", "3.12", "3.13"]
        type: string
      fail_fast:
        required: false
        default: true
        type: boolean
      default_branch:
        required: false
        default: 'main'
        type: string
    secrets:
      META_REPO_ACCESS_TOKEN:
        description: Token to use to trigger bump workflow on robotpy-meta
      RTD_TOKEN:
        description: Token to trigger ReadTheDocs webhook
      RTD_WEBHOOK:
        description: ReadTheDocs webhook URL
      WPI_ARTIFACTORY_USERNAME:
        description: Username to upload to artifactory
      WPI_ARTIFACTORY_TOKEN:
        description: Token to use to upload to artifactory
      PYPI_API_TOKEN:
        description: Token to publish the package to PyPI

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:

  # This job limits concurrency on the default branch
  # - we want it to run so it can populate ccache, but we typically
  #   don't care about when it completes, so limit its concurrency
  #   to stop eating up valuable + slow Windows/macOS runners
  setup_concurrency:
    runs-on: ubuntu-latest
    outputs:
      max-parallel: ${{ steps.max-parallel.outputs.p }}
    steps:
    - name: Setup concurrency
      shell: bash
      id: max-parallel
      run: |
        if [[ "${{ github.ref_name }}" == "${{ inputs.default_branch }}" ]]; then
          echo "PARALLEL=1"
          echo "p={\"v\": 1}" >> $GITHUB_OUTPUT
        else
          echo "PARALLEL=10000"
          echo "p={\"v\": 10000}" >> $GITHUB_OUTPUT
        fi

  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: psf/black@stable

  #
  # Build native wheels
  #

  build:
    runs-on: ${{ matrix.os }}
    needs: [setup_concurrency]
    strategy:
      max-parallel: ${{ fromJSON(needs.setup_concurrency.outputs.max-parallel).v }}
      fail-fast: ${{ inputs.fail_fast }}
      matrix:
        os: ${{ fromJSON(inputs.matrix_os) }}
        python_version: ${{ fromJson(inputs.python_versions) }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}

    - name: Setup MSVC
      uses: bus1/cabuild/action/msdevshell@e22aba57d6e74891d059d66501b6b5aed8123c4d  # v1
      with:
        architecture: x64
      if: runner.os == 'Windows'

    - name: Set ccache variant
      shell: bash
      id: ccache
      run: |
        #if [[ "${{ runner.os }}" == "Windows" ]]; then
        #  echo "VARIANT=sccache" >> $GITHUB_OUTPUT
        #  echo "RPYBUILD_CC_LAUNCHER=sccache" >> $GITHUB_ENV
        #else
          echo "VARIANT=ccache" >> $GITHUB_OUTPUT
          echo "RPYBUILD_CC_LAUNCHER=ccache" >> $GITHUB_ENV
        #fi

    - name: Setup ccache
      # uses: hendrikmuhs/ccache-action@v1.2.11
      uses: robotpy/ccache-action@fork
      with:
          key: ${{ matrix.os }}-${{ matrix.python_version }}
          variant: ${{ steps.ccache.outputs.variant }}

    - uses: robotpy/build-actions/install-semiwrap@v2025
    - uses: robotpy/build-actions/install-build-deps@v2025
    - uses: robotpy/build-actions/build-wheel@v2025
      with:
        osx_target: ${{ inputs.osx_target }}

    - uses: robotpy/build-actions/test-native-wheel@v2025

    - uses: robotpy/build-actions/validate-sphinx@v2025
      if: |
        inputs.enable_sphinx_check && inputs.enable_rtd &&
        matrix.python_version == '3.11' && runner.os == 'Linux' &&
        github.event_name == 'pull_request'

    - if: matrix.os != "macos-14"
      uses: actions/upload-artifact@v4
      with:
        name: "pypi-${{ runner.os }}-${{ matrix.python_version }}"
        path: dist

    - if: matrix.os == "macos-14"
      uses: actions/upload-artifact@v4
      with:
        name: "pypi-${{ runner.os }}-arm-${{ matrix.python_version }}"
        path: dist
  
  build-arm:
    runs-on: ubuntu-22.04-arm
    needs: [setup_concurrency]
    strategy:
      max-parallel: ${{ fromJSON(needs.setup_concurrency.outputs.max-parallel).v }}
      fail-fast: true
      matrix:
        python_version:
        - '3.11'
        - '3.12'
        - '3.13'
    container: python:${{ matrix.python_version }}-bookworm

    steps:
    - name: Setup dependencies
      run: apt-get update && apt-get install -y libgl1 ninja-build

    - uses: actions/checkout@v4
      if: inputs.enable_raspbian


    #
    # Setup build caching
    #

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    # See https://github.com/pypa/setuptools_scm/issues/784
    - name: Set git directory as safe to allow setuptools-scm to work
      shell: bash
      run: |
        /usr/bin/git config --global --add safe.directory $PWD

    - name: Install numpy (needed for stubgen)
      shell: bash
      if: inputs.enable_raspbian
      run: |
        python -m pip --disable-pip-version-check install numpy

    - uses: robotpy/build-actions/install-semiwrap@v2025
      if: inputs.enable_raspbian
    - uses: robotpy/build-actions/install-build-deps@v2025
      if: inputs.enable_raspbian

    - name: setup env
      shell: bash
      run: |
        echo "SCCACHE_WEBDAV_USERNAME=${{ secrets.WPI_ARTIFACTORY_USERNAME }}" >> $GITHUB_ENV
        echo "SCCACHE_WEBDAV_PASSWORD=${{ secrets.WPI_ARTIFACTORY_TOKEN }}" >> $GITHUB_ENV
        

    - uses: robotpy/build-actions/build-wheel@v2025
      if: inputs.enable_raspbian
    
    - uses: actions/upload-artifact@v4
      if: inputs.enable_raspbian
      with:
        name: "pypi-${{ runner.os }}-arm-${{ matrix.python_version }}"
        path: dist

  #
  # Build roboRIO/raspbian wheels
  #

  cross-build:
    runs-on: ubuntu-latest
    needs: [setup_concurrency]
    strategy:
      max-parallel: ${{ fromJSON(needs.setup_concurrency.outputs.max-parallel).v }}
      matrix:
        os:
        - container: wpilib/roborio-cross-ubuntu:2025-22.04-py313
          name: roborio

        - container: wpilib/raspbian-cross-ubuntu:2025-bookworm-22.04-py311
          name: raspbian-py311
        - container: wpilib/raspbian-cross-ubuntu:2025-bookworm-22.04-py312
          name: raspbian-py312
        - container: wpilib/raspbian-cross-ubuntu:2025-bookworm-22.04-py313
          name: raspbian-py313

    container:
      image: "${{ matrix.os.container }}"

    steps:
    - uses: actions/checkout@v4
      if: (inputs.enable_raspbian && startsWith(matrix.os.name, 'raspbian')) || (inputs.enable_roborio && matrix.os.name == 'roborio')

    - name: Setup cross environment for meson
      uses: robotpy/build-actions/setup-cross-meson@v2025

    - run: apt-get update
    - name: Setup ccache
      # uses: hendrikmuhs/ccache-action@v1.2.11
      uses: robotpy/ccache-action@fork
      with:
          key: ${{ matrix.os.container }}
          variant: ccache

    - uses: robotpy/build-actions/install-semiwrap@v2025
      if: (inputs.enable_raspbian && startsWith(matrix.os.name, 'raspbian')) || (inputs.enable_roborio && matrix.os.name == 'roborio')
      with:
        python: /build/venv/bin/cross-python
    - uses: robotpy/build-actions/install-build-deps@v2025
      if: (inputs.enable_raspbian && startsWith(matrix.os.name, 'raspbian')) || (inputs.enable_roborio && matrix.os.name == 'roborio')
      with:
        python: /build/venv/bin/cross-python

    - name: Show installed packages
      shell: bash
      run: |
        /build/venv/bin/build-python -m pip list
        /build/venv/bin/cross-python -m pip list

    # See https://github.com/pypa/setuptools_scm/issues/784
    - name: Set git directory as safe to allow setuptools-scm to work
      shell: bash
      run: |
        pwd
        /usr/bin/git config --global --add safe.directory $(pwd)

    - uses: robotpy/build-actions/build-wheel@v2025
      if: (inputs.enable_raspbian && startsWith(matrix.os.name, 'raspbian')) || (inputs.enable_roborio && matrix.os.name == 'roborio')
      with:
        python: /build/venv/bin/cross-python
        build_args: --config-setting=setup-args=--cross-file=cross.txt

    - uses: actions/upload-artifact@v4
      if: (inputs.enable_raspbian && startsWith(matrix.os.name, 'raspbian')) || (inputs.enable_roborio && matrix.os.name == 'roborio')
      with:
        name: cross-${{ matrix.os.name }}
        path: dist

  #
  # Publish wheels to wpilib artifactory, pypi
  #

  publish-rpyrepo:
    runs-on: ubuntu-latest
    needs: [check, build, build-arm, cross-build]
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')

    steps:
    - if: inputs.enable_roborio || inputs.enable_raspbian
      uses: actions/download-artifact@v4
      with:
        pattern: cross-*
        path: dist/
        merge-multiple: true

    - if: inputs.enable_roborio || inputs.enable_raspbian
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verify-metadata: false
        user: ${{ secrets.WPI_ARTIFACTORY_USERNAME }}
        password: ${{ secrets.WPI_ARTIFACTORY_TOKEN }}
        repository-url: https://wpilib.jfrog.io/artifactory/api/pypi/${{ inputs.artifactory_repo_type }}-python-release-2025-local


  publish-pypi:
    runs-on: ubuntu-latest
    needs: [check, build, build-arm, cross-build]
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        pattern: pypi-*
        path: dist/
        merge-multiple: true

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        verify-metadata: false

  ping-rtd:
    runs-on: ubuntu-latest
    needs: [check, build, build-arm, cross-build]
    if: |
      inputs.enable_rtd && github.event_name == 'push' &&
      (startsWith(github.event.ref, 'refs/tags') || github.event.ref == 'refs/heads/main')
    steps:
    - name: Sleep 1 minute to allow artifact upload
      shell: bash
      run: sleep 60
    - name: Ping readthedocs
      uses: robotpy/build-actions/ping-rtd@v2025
      with:
        token: ${{ secrets.RTD_TOKEN }}
        webhook: ${{ secrets.RTD_WEBHOOK }}

  # ping:
  #   runs-on: ubuntu-latest
  #   needs: [publish-rpyrepo, publish-pypi]
  #   if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')

  #   steps:
  #   - uses: robotpy/build-actions/ping-meta@v2025
  #     with:
  #       token: ${{ secrets.META_REPO_ACCESS_TOKEN }}
