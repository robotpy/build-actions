---
name: Package Pure CI

on:
  workflow_call:
    inputs:
      enable_sphinx_check:
        required: false
        default: true
        type: boolean

    secrets:
      META_REPO_ACCESS_TOKEN:
        description: Token to use to trigger bump workflow on robotpy-meta
      PYPI_API_TOKEN:
        description: Token to publish the package to PyPI


jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: psf/black@stable
  
  #
  # Build a wheel
  #

  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - uses: hynek/build-and-inspect-python-package@v3.0.1

  #
  # Test wheels
  #

  test:
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2025, macos-15, macos-15-intel, ubuntu-26.04]
        python_version:
        - '3.12'
        - '3.13'
        - '3.14'
        - '3.15'

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python_version }}
    
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: dist

    - uses: robotpy/build-actions/test-native-wheel@v2027

    - uses: robotpy/build-actions/validate-sphinx@v2027
      if: inputs.enable_sphinx_check && matrix.python_version == '3.14' && startsWith(matrix.os, 'ubuntu-')


  publish:
    runs-on: ubuntu-latest
    needs: [check, test]
    permissions:
      id-token: write
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: dist

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        verify-metadata: false

    # - uses: robotpy/build-actions/ping-meta@v2024
    #   with:
    #     token: ${{ secrets.META_REPO_ACCESS_TOKEN }}
