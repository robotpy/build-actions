name: build-wheel
description: "Builds wheel"
inputs:
  python:
    description: "python executable"
    required: false
    default: python
  osx_target:
    description: Target OSX platform
    required: false
    default:
  build_args:
    description: Extra build args
    required: false
    default:
runs:
  using: composite
  steps:
  - name: Set default shell
    shell: bash
    id: default_shell
    run: |
      if [[ "${{ runner.os }}" == "Windows" ]]; then
        echo "SHELL=pwsh" >> $GITHUB_OUTPUT
      else
        echo "SHELL=bash" >> $GITHUB_OUTPUT
      fi

  - name: Setup default OSX deployment target
    shell: bash
    run: |
      echo "MACOSX_DEPLOYMENT_TARGET=13.3" >> $GITHUB_ENV
  - name: Setup override OSX deployment target
    shell: bash
    run: |
      echo "MACOSX_DEPLOYMENT_TARGET=${{ inputs.osx_target }}" >> $GITHUB_ENV
    if: ${{ inputs.osx_target != '' }}
  
  - name: Show installed packages
    shell: ${{ steps.default_shell.outputs.shell }}
    run: |
      ${{ inputs.python }} -m pip list

  - name: Run build
    shell: ${{ steps.default_shell.outputs.shell }}
    run: |
      ${{ inputs.python }} -m build -w --no-isolation ${{ inputs.build_args }}

  - shell: bash
    run: |
      ORIG_PLAT_TAG="linux_x86_64"
      MANYLINUX_TAG="manylinux_2_35_x86_64"
      for x in $(find ./dist -name "*$ORIG_PLAT_TAG.whl"); do mv $x ${x%$ORIG_PLAT_TAG.whl}$MANYLINUX_TAG.whl;done
      ls -l ./dist/*
  - shell: bash
    run: |
      ORIG_PLAT_TAG="linux_aarch64"
      MANYLINUX_TAG="manylinux_2_36_aarch64"
      for x in $(find ./dist -name "*$ORIG_PLAT_TAG.whl"); do mv $x ${x%$ORIG_PLAT_TAG.whl}$MANYLINUX_TAG.whl;done
      ls -l ./dist/*
  - shell: bash
    run: |
      ORIG_PLAT_TAG="macosx_11_0_x86_64"
      MAC_COMPAT_TAG="macosx_10_16_x86_64"
      for x in $(find ./dist -name "*$ORIG_PLAT_TAG.whl"); do mv $x ${x%$ORIG_PLAT_TAG.whl}$MAC_COMPAT_TAG.whl;done
      ls -l ./dist/*
