name: "install-build-deps"
description: "Install build dependencies"
inputs:
  python:
    description: "python executable"
    required: false
    default: python
runs:
  using: "composite"
  steps:
  - shell: bash
    run: |
      ${{ inputs.python }} -m pip install build
  - shell: bash
    run: |
      ${{ inputs.python }} -m semiwrap build-dep --install
